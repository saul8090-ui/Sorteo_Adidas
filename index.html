<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Adidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --adidas-green: #0f5b33; /* Verde oscuro de marca */
            --adidas-dark: #0a3a20;
            --adidas-gold: #f4d03f;
            --adidas-red: #c8102e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body {
            /* Mantenemos el degradado oscuro, pero un poco más brillante en el centro para dar contexto */
            background: radial-gradient(circle at center, #157341 0%, #000000 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .logo-container {
            width: 180px; /* Reducido para compactar */
            margin-bottom: 20px; /* Reducido para compactar */
            z-index: 2;
        }

        .logo-container svg {
            width: 100%;
            height: auto;
            fill: #fff; /* Asegura que el logo sea blanco para contrastar con el fondo oscuro */
            display: block;
        }

        .title {
            font-size: 2.2rem; /* Reducido para compactar */
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 5px; /* Reducido para compactar */
            color: var(--adidas-gold);
        }

        .subtitle {
            font-size: 1.2rem; /* Reducido para compactar */
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px; /* Reducido para compactar */
            color: #eee;
        }

        .ticket-display {
            font-size: 9rem; /* Reducido para compactar, era 12rem */
            font-weight: 900;
            background: #fff;
            color: var(--adidas-dark); /* Color del texto dentro del boleto */
            padding: 15px 50px; /* Reducido para compactar */
            border-radius: 12px; /* Ligeramente menos redondeado para estética más limpia */
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            margin-bottom: 30px; /* Reducido para compactar */
            min-width: 350px; /* Reducido para compactar, era 450px */
            border: 6px solid var(--adidas-gold); /* Borde un poco más delgado */
            transition: all 0.3s ease;
        }

        /* Estilo para resaltar cuando sale el 3er boleto */
        .premiado-final {
            animation: pulse-premiado 1s ease 3; /* Pulsa 3 veces y para */
            background-color: var(--adidas-gold);
            color: #000;
            border-color: #fff;
        }

        @keyframes pulse-premiado {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn-sorteo {
            background-color: var(--adidas-gold);
            color: #000;
            border: none;
            padding: 15px 40px; /* Reducido para compactar */
            font-size: 1.2rem; /* Reducido para compactar */
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 208, 63, 0.3);
            transition: all 0.2s;
        }

        .btn-sorteo:hover {
            transform: scale(1.05);
        }

        .btn-sorteo:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        .reset-container {
            position: absolute;
            bottom: 15px; /* Reducido */
            right: 15px; /* Reducido */
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .reset-container:hover { opacity: 0.8; }
        .btn-reset {
            background: none; border: 1px solid rgba(255,255,255,0.5); color: rgba(255,255,255,0.8);
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Logo antiguo (Trifolio) de Adidas blanco en SVG para máxima calidad y contraste -->
        <svg viewBox="0 0 512 472" xmlns="http://www.w3.org/2000/svg">
            <path d="M495 244.6C473.1 202.6 429 173 371 173c-23.7 0-46.1 4.9-66.2 13.8L355 45.4c1.3-3.6 1.8-7.3 1.8-11.2s-.5-7.3-1.8-11.2C347.8 7.3 331.6 0 312 0s-35.8 7.3-43.2 23c-1.3 3.6-1.8 7.3-1.8 11.2s.5 7.6 1.8 11.2l50.2 141.4C298.9 177.9 276.5 173 252.8 173H252.3 251.8c-23.7 0-46.1 4.9-66.2 13.8L235.8 45.4c1.3-3.6 1.8-7.3 1.8-11.2s-.5-7.6-1.8-11.2C228.6 7.3 212.4 0 192.8 0S157 7.3 149.6 23c-1.3 3.6-1.8 7.3-1.8 11.2s.5 7.6 1.8 11.2l50.2 141.4C179.7 177.9 157.3 173 133.6 173c-58 0-102.1 29.6-124 71.6C2.1 258.9.5 273.7.5 289.1c0 15.4 1.6 30.2 9.1 44.5 21.9 42 66 71.6 124 71.6 23.7 0 46.1-4.9 66.2-13.8l10 27.9c1.3 3.6 1.8 7.3 1.8 11.2s-.5 7.6-1.8 11.2c-7.2 15.7-23.4 23-43 23s-35.8-7.3-43.2-23c-1.3-3.6-1.8-7.3-1.8-11.2s.5-7.6 1.8-11.2c7.4-15.7 23.6-23 43.2-23 19.6 0 35.8 7.3 43.2 23 1.3 3.6 1.8 7.3 1.8 11.2s-.5 7.6-1.8 11.2C216.2 464 200 471.3 180.4 471.3h2.6c19.6 0 35.8-7.3 43.2-23 1.3-3.6 1.8-7.3 1.8-11.2s-.5-7.6-1.8-11.2c-7.4-15.7-23.6-23-43.2-23-19.6 0-35.8 7.3-43.2 23-1.3 3.6-1.8 7.3-1.8 11.2s.5 7.6 1.8 11.2c7.2 15.7 23.4 23 43 23s35.8-7.3 43.2-23c1.3-3.6 1.8-7.3 1.8-11.2s-.5-7.6-1.8-11.2c7.4-15.7 23.6-23 43.2-23 19.6 0 35.8 7.3 43.2 23 1.3 3.6 1.8 7.3 1.8 11.2s-.5 7.6-1.8 11.2C375.4 464 359.2 471.3 339.6 471.3s-35.8-7.3-43.2-23c-1.3-3.6-1.8-7.3-1.8-11.2s.5-7.6 1.8-11.2l-10-27.9c20.1 8.9 42.5 13.8 66.2 13.8 58 0 102.1-29.6 124-71.6 7.5-14.3 9.1-29.1 9.1-44.5 0-15.4-1.6-30.2-9.1-44.5z"/>
        </svg>
    </div>

    <h1 class="title">SORTEO ESPECIAL</h1>
    <h2 class="subtitle">Gana el 3er boleto sorteado</h2>
    
    <div class="ticket-display" id="display">--</div>

    <button class="btn-sorteo" id="btn-iniciar" disabled>Cargando participantes...</button>
    
    <!-- Botón oculto para reiniciar la cuenta si es necesario -->
    <div class="reset-container">
        <button class="btn-reset" onclick="resetSorteo()">Reiniciar Cuenta</button>
    </div>

    <script>
        // URL CORREGIDA: Ya incluye el ?action=sorteo al final
        const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwau3NU3HutYO5LjEfv4hqfz41DjZWo3LChZ-jaglgGNzWapF9tzYodF8JDMvssUJR9/exec?action=sorteo';
        
        let participantes = [];
        let boletosSorteados = 0; 
        const display = document.getElementById('display');
        const btnIniciar = document.getElementById('btn-iniciar');

        // Cargar los participantes desde Google Sheets al abrir la página
        fetch(APP_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.tickets.length > 0) {
                    participantes = data.tickets;
                    actualizarTextoBoton();
                    btnIniciar.disabled = false;
                } else {
                    btnIniciar.innerText = "Nadie se ha registrado aún";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                btnIniciar.innerText = "Error de conexión";
            });

        // Función para actualizar el texto del botón según la ronda
        function actualizarTextoBoton() {
            if (boletosSorteados === 0) btnIniciar.innerText = "SORTEAR BOLETO 1";
            else if (boletosSorteados === 1) btnIniciar.innerText = "SORTEAR BOLETO 2";
            else if (boletosSorteados === 2) btnIniciar.innerText = "SORTEAR BOLETO 3 (GANADOR)";
            else btnIniciar.innerText = "FIN DEL SORTEO";
        }

        // Lógica de la ruleta animada con FRENADO (Deceleración)
        btnIniciar.addEventListener('click', () => {
            if (participantes.length === 0 || boletosSorteados >= 3) return;

            btnIniciar.disabled = true;
            display.classList.remove('premiado-final');
            
            // --- CONFIGURACIÓN DE LA ANIMACIÓN ---
            const duracionFaseRapida = 3000; 
            const totalCambiosFrenado = 25;   
            const velocidadInicial = 40;     
            const factorFrenado = 1.15;       

            let tiempoAcumulado = 0;
            let cambiosFrenadoRealizados = 0;
            let velocidadActual = velocidadInicial;

            function iterarRuleta() {
                const randomVisual = participantes[Math.floor(Math.random() * participantes.length)];
                display.innerText = randomVisual;

                if (tiempoAcumulado < duracionFaseRapida) {
                    tiempoAcumulado += velocidadActual;
                    setTimeout(iterarRuleta, velocidadActual);
                } else if (cambiosFrenadoRealizados < totalCambiosFrenado) {
                    cambiosFrenadoRealizados++;
                    velocidadActual *= factorFrenado; 
                    setTimeout(iterarRuleta, velocidadActual);
                } else {
                    finalizarRonda();
                }
            }

            iterarRuleta();
        });

        function finalizarRonda() {
            const numeroFinal = participantes[Math.floor(Math.random() * participantes.length)];
            display.innerText = numeroFinal;
            
            boletosSorteados++;
            actualizarTextoBoton();

            if (boletosSorteados === 3) {
                // Al salir el tercero, mostramos el efecto visual y el suspense
                // pero eliminamos el 'alert' para que no corte la emoción.
                display.classList.add('premiado-final');
                btnIniciar.disabled = true;
                btnIniciar.innerText = "¡FELICIDADES!";
            } else {
                btnIniciar.disabled = false;
            }
        }
        
        function resetSorteo() {
            boletosSorteados = 0;
            display.innerText = "--";
            display.classList.remove('premiado-final');
            actualizarTextoBoton();
            btnIniciar.disabled = false;
        }
    </script>
</body>
</html>
