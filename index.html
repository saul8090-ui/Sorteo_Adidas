<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo Adidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --adidas-green: #0f5b33;
            --adidas-dark: #0a3a20;
            --adidas-gold: #f4d03f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body {
            background: radial-gradient(circle at center, var(--adidas-green) 0%, #000000 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .logo-container {
            width: 250px;
            margin-bottom: 40px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--adidas-gold);
        }

        .ticket-display {
            font-size: 12rem;
            font-weight: 900;
            background: #fff;
            color: var(--adidas-dark);
            padding: 20px 80px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 50px;
            min-width: 400px;
            border: 8px solid var(--adidas-gold);
            transition: all 0.3s ease;
        }

        .btn-sorteo {
            background-color: var(--adidas-gold);
            color: #000;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(244, 208, 63, 0.4);
            transition: transform 0.2s;
        }

        .btn-sorteo:hover {
            transform: scale(1.05);
        }

        .btn-sorteo:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Animación cuando hay un ganador */
        .winner-anim {
            animation: pulse-winner 1s ease infinite;
            background-color: var(--adidas-gold);
            color: #000;
            border-color: #fff;
        }

        @keyframes pulse-winner {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="https://1000marcas.net/wp-content/uploads/2019/11/Logo-Adidas.png" alt="Adidas">
    </div>

    <h1 class="title">Sorteo Especial</h1>
    
    <div class="ticket-display" id="display">--</div>

    <button class="btn-sorteo" id="btn-iniciar">Cargando participantes...</button>

    <script>
        // URL CORREGIDA: Ya incluye el ?action=sorteo al final
        const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwau3NU3HutYO5LjEfv4hqfz41DjZWo3LChZ-jaglgGNzWapF9tzYodF8JDMvssUJR9/exec?action=sorteo';
        
        // (Opcional) Puedes agregar un audio de redoble de tambores y platillos aquí
        // const audioRedoble = new Audio('LINK_AUDIO_REDOBLE.mp3');
        // const audioGanador = new Audio('LINK_AUDIO_GANADOR.mp3');

        let participantes = [];
        const display = document.getElementById('display');
        const btnIniciar = document.getElementById('btn-iniciar');

        // Cargar los participantes desde Google Sheets al abrir la página
        fetch(APP_SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.tickets.length > 0) {
                    participantes = data.tickets;
                    btnIniciar.innerText = "¡SACAR GANADOR!";
                    btnIniciar.disabled = false;
                } else {
                    btnIniciar.innerText = "Nadie se ha registrado aún";
                }
            })
            .catch(error => {
                console.error('Error:', error);
                btnIniciar.innerText = "Error de conexión";
            });

        // Lógica de la ruleta animada
        btnIniciar.addEventListener('click', () => {
            if (participantes.length === 0) return;

            btnIniciar.disabled = true;
            display.classList.remove('winner-anim');
            
            // audioRedoble.play(); // Descomenta si usas audio

            let counter = 0;
            const maxTicks = 40; // Cuántas veces cambiará el número (duración del suspenso)
            const speed = 50; // Velocidad de cambio en milisegundos

            const ruleta = setInterval(() => {
                // Selecciona un ticket al azar para el efecto visual
                const randomVisual = participantes[Math.floor(Math.random() * participantes.length)];
                display.innerText = randomVisual;
                counter++;

                if (counter >= maxTicks) {
                    clearInterval(ruleta);
                    
                    // Seleccionar ganador final real
                    const ganadorFinal = participantes[Math.floor(Math.random() * participantes.length)];
                    display.innerText = ganadorFinal;
                    display.classList.add('winner-anim');
                    
                    // audioRedoble.pause();
                    // audioGanador.play(); // Descomenta si usas audio
                    
                    btnIniciar.innerText = "SACAR OTRO GANADOR";
                    btnIniciar.disabled = false;
                }
            }, speed);
        });
    </script>
</body>
</html>
